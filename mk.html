<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=admin-login.html">
    <title>Life Saver - Admin Gateway</title>
    <script>
        window.location.replace("admin-login.html");
    </script>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .gateway-card {
            text-align: center;
            padding: 2rem;
            border-radius: 1.5rem;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="gateway-card">
        <div class="spinner"></div>
        <h2 style="margin: 0 0 0.5rem; font-size: 1.25rem; font-weight: 800;">Opening Life Saver Admin Portal...</h2>
        <p style="margin: 0; font-size: 0.875rem; color: #94a3b8;">Redirecting to secure administrative portal.</p>
        <p style="margin-top: 1rem; font-size: 0.75rem;"><a href="admin-login.html" style="color: #60a5fa;">Click here if not redirected automatically</a></p>
    </div>
</body>
</html>
