services:
  - type: web
    name: lifesaver-care
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: lifesaver-secure-database-key-2026-production
      - key: FRONTEND_URL
        value: https://lifesaver.qd.je
      - key: API_URL
        value: https://lifesaver.qd.je
      - key: DATABASE_URL
        sync: false

