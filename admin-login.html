<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - Life Saver</title>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="security.js" defer></script>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="glass-card w-full max-w-md p-8 rounded-3xl border border-blue-200 dark:border-slate-800 shadow-xl bg-white dark:bg-slate-900 relative">
        <div class="absolute top-5 right-5">
            <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Toggle Light/Dark Theme">
                <i data-lucide="moon" class="w-4 h-4"></i>
            </button>
        </div>

        <div class="text-center mb-8">
            <div class="bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-blue-100 dark:border-blue-900/50">
                <i data-lucide="shield-check" class="w-7 h-7"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">Admin Portal Access</h1>
            <p class="text-slate-500 dark:text-slate-400 text-xs mt-1">Authorized personnel login for Life Saver management</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Access Role</label>
                <select id="adminRoleSelect" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white p-3 rounded-xl text-xs font-bold outline-none focus:border-blue-500">
                    <option value="SUPER_ADMIN">👑 Super Admin (Full Control)</option>
                    <option value="SUB_ADMIN">👤 Sub Admin (Read-Only Access)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Admin Email</label>
                <input type="email" id="email" required placeholder="admin@lifesaver.org" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white p-3 rounded-xl text-sm outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Admin Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white p-3 rounded-xl text-sm outline-none focus:border-blue-500">
            </div>

            <div class="flex items-center justify-end text-xs text-slate-500 dark:text-slate-400">
                <a href="#" id="forgotAdminPasswordBtn" onclick="openAdminResetModal(); return false;" class="text-blue-600 dark:text-blue-400 hover:underline font-semibold">Forgot password?</a>
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl text-sm transition shadow-md shadow-blue-500/20">
                Authenticate Admin Access
            </button>
        </form>

        <a href="index.html" class="block text-center mt-6 text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">
            ← Back to Main Home Page
        </a>
    </div>

    <!-- ADMIN PASSWORD RESET SCREEN MODAL OVERLAY -->
    <div id="adminResetModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-md p-6 sm:p-8 rounded-3xl border border-blue-200 dark:border-slate-800 shadow-2xl bg-white dark:bg-slate-900 relative animate-in fade-in zoom-in duration-200">
            <button onclick="closeAdminResetModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 dark:hover:text-white p-1 rounded-xl transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <!-- STEP 1: VERIFY ADMIN IDENTITY -->
            <div id="adminResetStep1">
                <div class="text-center mb-5">
                    <div class="bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 w-11 h-11 rounded-2xl flex items-center justify-center mx-auto mb-2 border border-blue-100 dark:border-blue-900/50">
                        <i data-lucide="shield-alert" class="w-5 h-5"></i>
                    </div>
                    <h3 class="text-lg font-black text-slate-900 dark:text-white">Reset Admin Password</h3>
                    <p class="text-slate-500 dark:text-slate-400 text-xs">Verify your admin email & registered username</p>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Admin Email *</label>
                        <input type="email" id="adminResetEmail" required placeholder="admin@lifesaver.org" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white p-2.5 rounded-xl text-xs outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Admin Name / Username * (Case Insensitive)</label>
                        <input type="text" id="adminResetName" required placeholder="e.g. Sub Admin" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white p-2.5 rounded-xl text-xs outline-none focus:border-blue-500">
                    </div>
                    <div id="adminResetMsgStep1" class="hidden text-xs p-3 rounded-xl font-semibold"></div>
                    <button type="button" id="btnVerifyAdminEmail" onclick="verifyAdminEmailForReset()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl text-xs transition shadow-md shadow-blue-500/20">
                        Verify Admin Identity →
                    </button>
                </div>
            </div>

            <!-- STEP 2: NEW ADMIN PASSWORD -->
            <div id="adminResetStep2" class="hidden">
                <div class="text-center mb-6">
                    <div class="bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-emerald-100 dark:border-emerald-900/50">
                        <i data-lucide="check-circle" class="w-6 h-6"></i>
                    </div>
                    <h3 class="text-xl font-black text-slate-900 dark:text-white">Create New Admin Password</h3>
                    <p class="text-slate-500 dark:text-slate-400 text-xs mt-1" id="verifiedAdminLabel">Admin Verified</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">New Password</label>
                        <input type="password" id="newAdminResetPassword" placeholder="•••••••• (min 6 characters)" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white p-3 rounded-xl text-sm outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Confirm New Password</label>
                        <input type="password" id="confirmAdminResetPassword" placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white p-3 rounded-xl text-sm outline-none focus:border-blue-500">
                    </div>
                    <div id="adminResetMsgStep2" class="hidden text-xs p-3 rounded-xl font-semibold"></div>
                    <button type="button" id="btnSaveAdminPassword" onclick="saveNewAdminPassword()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-xl text-sm transition shadow-md shadow-emerald-500/20">
                        Save New Password & Authenticate
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyD9qUADNpQwX5iFp_qELRSGhHFswi-NoBc",
            authDomain: "life-saver-be5cf.firebaseapp.com",
            databaseURL: "https://life-saver-be5cf-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "life-saver-be5cf",
            storageBucket: "life-saver-be5cf.firebasestorage.app",
            messagingSenderId: "549675407162",
            appId: "1:549675407162:web:ba3c8878834cb4123ba203"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let targetResetSubAdminKey = null;
        let targetResetRole = null;

        window.openAdminResetModal = function() {
            const emailInForm = document.getElementById('email')?.value?.trim() || '';
            const resetEmailInput = document.getElementById('adminResetEmail');
            if (resetEmailInput) resetEmailInput.value = emailInForm;
            
            document.getElementById('adminResetStep1').classList.remove('hidden');
            document.getElementById('adminResetStep2').classList.add('hidden');
            document.getElementById('adminResetMsgStep1').classList.add('hidden');
            document.getElementById('adminResetMsgStep2').classList.add('hidden');
            document.getElementById('adminResetModal').classList.remove('hidden');
            targetResetSubAdminKey = null;
            targetResetRole = null;
        };

        window.closeAdminResetModal = function() {
            document.getElementById('adminResetModal').classList.add('hidden');
        };

        window.verifyAdminEmailForReset = async function() {
            const email = document.getElementById('adminResetEmail').value.trim();
            const name = document.getElementById('adminResetName').value.trim();
            const msgBox = document.getElementById('adminResetMsgStep1');
            const btn = document.getElementById('btnVerifyAdminEmail');
            const role = document.getElementById('adminRoleSelect').value;

            if (!email || !email.includes('@')) {
                msgBox.className = "text-xs p-3 rounded-xl font-semibold bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900";
                msgBox.textContent = "Please enter a valid admin email address.";
                msgBox.classList.remove('hidden');
                return;
            }

            if (!name) {
                msgBox.className = "text-xs p-3 rounded-xl font-semibold bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900";
                msgBox.textContent = "Please enter your registered Admin Name for verification.";
                msgBox.classList.remove('hidden');
                return;
            }

            btn.innerText = "Verifying admin record...";
            btn.disabled = true;
            msgBox.classList.add('hidden');

            try {
                if (role === 'SUB_ADMIN') {
                    const snap = await get(ref(db, 'sub_admins'));
                    let foundKey = null;
                    let foundData = null;

                    if (snap.exists()) {
                        const subAdmins = snap.val();
                        Object.keys(subAdmins).forEach(k => {
                            const sa = subAdmins[k];
                            if ((sa.email && sa.email.toLowerCase() === email.toLowerCase()) ||
                                (k.toLowerCase() === name.toLowerCase())) {
                                foundKey = k;
                                foundData = sa;
                            }
                        });
                    }

                    if (!foundKey) {
                        msgBox.className = "text-xs p-3 rounded-xl font-semibold bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-900";
                        msgBox.textContent = "No Sub-Admin account found matching this email address.";
                        msgBox.classList.remove('hidden');
                        btn.innerText = "Verify Admin Identity →";
                        btn.disabled = false;
                        return;
                    }

                    // Case-insensitive name match
                    const dbName = (foundData.name || foundKey || "").toLowerCase().trim();
                    const inputName = name.toLowerCase().trim();
                    const nameMatches = dbName.length === 0 || dbName === inputName || dbName.includes(inputName) || inputName.includes(dbName);

                    if (!nameMatches) {
                        msgBox.className = "text-xs p-3 rounded-xl font-semibold bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900";
                        msgBox.textContent = "❌ Security Identity Failed: The Admin Name does not match records for this email.";
                        msgBox.classList.remove('hidden');
                        return;
                    }

                    targetResetSubAdminKey = foundKey;
                    targetResetRole = 'SUB_ADMIN';
                    document.getElementById('verifiedAdminLabel').textContent = `Sub-Admin Verified: ${foundData.name || email}`;
                } else {
                    targetResetRole = 'SUPER_ADMIN';
                    await sendPasswordResetEmail(auth, email);
                    alert(`📧 Password reset email sent to ${email}.\nPlease check your inbox to reset your Super Admin password.`);
                    closeAdminResetModal();
                    return;
                }

                document.getElementById('adminResetStep1').classList.add('hidden');
                document.getElementById('adminResetStep2').classList.remove('hidden');
                if (window.lucide) lucide.createIcons();
            } catch (err) {
                console.error("Admin lookup error:", err);
                msgBox.className = "text-xs p-3 rounded-xl font-semibold bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900";
                msgBox.textContent = "Error verifying admin email: " + err.message;
                msgBox.classList.remove('hidden');
            } finally {
                btn.innerText = "Verify Admin Identity →";
                btn.disabled = false;
            }
        };

        window.saveNewAdminPassword = async function() {
            const pass1 = document.getElementById('newAdminResetPassword').value.trim();
            const pass2 = document.getElementById('confirmAdminResetPassword').value.trim();
            const msgBox = document.getElementById('adminResetMsgStep2');
            const btn = document.getElementById('btnSaveAdminPassword');

            if (!pass1 || pass1.length < 6) {
                msgBox.className = "text-xs p-3 rounded-xl font-semibold bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900";
                msgBox.textContent = "Password must be at least 6 characters long.";
                msgBox.classList.remove('hidden');
                return;
            }

            if (!pass2 || pass1 !== pass2) {
                msgBox.className = "text-xs p-3 rounded-xl font-semibold bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900";
                msgBox.textContent = "Passwords do not match. Please re-enter.";
                msgBox.classList.remove('hidden');
                return;
            }

            btn.innerText = "Updating password...";
            btn.disabled = true;
            msgBox.classList.add('hidden');

            try {
                if (targetResetRole === 'SUB_ADMIN' && targetResetSubAdminKey) {
                    await update(ref(db, `sub_admins/${targetResetSubAdminKey}`), {
                        password: pass1,
                        updatedAt: new Date().toISOString()
                    });
                }

                const adminEmailVal = document.getElementById('adminResetEmail').value.trim();
                const mainEmailInput = document.getElementById('email');
                const mainPasswordInput = document.getElementById('password');
                if (mainEmailInput) mainEmailInput.value = adminEmailVal;
                if (mainPasswordInput) mainPasswordInput.value = pass1;

                alert("🎉 Admin password updated successfully!\nYou can now sign in.");
                closeAdminResetModal();
            } catch (err) {
                console.error("Admin password update error:", err);
                msgBox.className = "text-xs p-3 rounded-xl font-semibold bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900";
                msgBox.textContent = "Failed to update admin password: " + err.message;
                msgBox.classList.remove('hidden');
            } finally {
                btn.innerText = "Save New Password & Authenticate";
                btn.disabled = false;
            }
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Authenticating Admin...";
            btn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const role = document.getElementById('adminRoleSelect').value;

            if (role === 'SUB_ADMIN') {
                try {
                    const snap = await get(ref(db, 'sub_admins'));
                    let matchedSubAdmin = null;

                    if (snap.exists()) {
                        const subAdmins = snap.val();
                        Object.keys(subAdmins).forEach(key => {
                            const sa = subAdmins[key];
                            if (sa.email && sa.email.toLowerCase() === email.toLowerCase() && sa.password === password) {
                                matchedSubAdmin = sa;
                            }
                        });
                    }

                    if (!matchedSubAdmin) {
                        alert("Invalid email or password.");
                        btn.innerText = "Authenticate Admin Access";
                        btn.disabled = false;
                        return;
                    }

                    if (matchedSubAdmin.status === 'Disabled') {
                        alert("Access Denied: Your Sub-Admin account has been disabled by Super Admin.");
                        btn.innerText = "Authenticate Admin Access";
                        btn.disabled = false;
                        return;
                    }

                    localStorage.setItem('adminRole', 'SUB_ADMIN');
                    localStorage.setItem('adminEmail', email);
                    localStorage.setItem('adminName', matchedSubAdmin.name || 'Sub Admin');
                    window.location.href = "admin.html";
                    return;
                } catch (err) {
                    console.error("Sub-admin login error:", err);
                    alert("Error authenticating Sub-Admin. Please try again.");
                    btn.innerText = "Authenticate Admin Access";
                    btn.disabled = false;
                    return;
                }
            }

            // SUPER_ADMIN login flow
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                // Security Check: Verify that the user is not a regular user/donor account
                const userSnap = await get(ref(db, `users/${uid}`));
                const adminSnap = await get(ref(db, `admins/${uid}`));

                let isAuthorizedSuperAdmin = false;

                if (adminSnap.exists() && (adminSnap.val().role === 'SUPER_ADMIN' || adminSnap.val().isAdmin === true)) {
                    isAuthorizedSuperAdmin = true;
                } else if (!userSnap.exists()) {
                    // Check if admins node is empty (initial super admin setup) or if account exists in admins node by email
                    const allAdminsSnap = await get(ref(db, 'admins'));
                    if (!allAdminsSnap.exists() || Object.keys(allAdminsSnap.val()).length === 0) {
                        isAuthorizedSuperAdmin = true;
                    } else {
                        const adminsObj = allAdminsSnap.val();
                        Object.keys(adminsObj).forEach(k => {
                            if (adminsObj[k].email && adminsObj[k].email.toLowerCase() === email.toLowerCase()) {
                                isAuthorizedSuperAdmin = true;
                            }
                        });
                    }
                }

                if (!isAuthorizedSuperAdmin) {
                    await signOut(auth);
                    alert("Access Denied: Regular user or unauthorized accounts cannot access the Admin Portal.");
                    btn.innerText = "Authenticate Admin Access";
                    btn.disabled = false;
                    return;
                }

                localStorage.setItem('adminRole', 'SUPER_ADMIN');
                localStorage.setItem('adminEmail', email);

                await set(ref(db, `admins/${uid}`), { isAdmin: true, role: 'SUPER_ADMIN', email: email, loginTime: new Date().toISOString() });

                window.location.href = "admin.html";
            } catch (error) {
                console.error("Super Admin authentication error:", error);
                alert("Invalid email or password.");
                btn.innerText = "Authenticate Admin Access";
                btn.disabled = false;
            }
        });
    </script>
    <script>
        lucide.createIcons();
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const btn = document.getElementById("themeToggleBtn");
            if (btn) {
                btn.innerHTML = isDark ? 
                    '<i data-lucide="sun" class="w-4 h-4 text-amber-400"></i>' : 
                    '<i data-lucide="moon" class="w-4 h-4 text-slate-700"></i>';
                if (window.lucide) lucide.createIcons();
            }
        }
        updateThemeIcon();
    </script>
</body>
</html>
